services:
  db:
    image: mysql:8.0
    container_name: student-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  backend:
    image: ${DOCKERHUB_USER}/student-backend:${IMAGE_TAG}
    container_name: student-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend-net, frontend-net]

  frontend:
    image: ${DOCKERHUB_USER}/student-frontend:${IMAGE_TAG}
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks: [frontend-net]

networks:
  frontend-net:
  backend-net:

volumes:
  db-data: